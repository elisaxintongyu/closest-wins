name: Branch Name Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches-ignore:
      - main

jobs:
  validate-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
        run: |
          pattern='^(main|develop|release/[a-z0-9._-]+|feature/[a-z0-9._-]+|fix/[a-z0-9._-]+|chore/[a-z0-9._-]+|docs/[a-z0-9._-]+|refactor/[a-z0-9._-]+|test/[a-z0-9._-]+|ci/[a-z0-9._-]+)$'

          if [[ ! "$BRANCH_NAME" =~ $pattern ]]; then
            echo "Branch '$BRANCH_NAME' does not match the naming convention."
            echo "Use one of: feature/, fix/, chore/, docs/, refactor/, test/, ci/, release/, main, develop."
            exit 1
          fi

          echo "Branch '$BRANCH_NAME' matches the naming convention."
