name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: closest_wins
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d closest_wins"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/closest_wins?schema=public
      DIRECT_URL: postgresql://postgres:postgres@127.0.0.1:5432/closest_wins?schema=public
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_ci_dummy_key
      CLERK_SECRET_KEY: sk_test_ci_dummy_key
      NEXT_PUBLIC_CLERK_SIGN_IN_URL: /sign-in
      NEXT_PUBLIC_CLERK_SIGN_UP_URL: /sign-up
      CLERK_SIGN_IN_FALLBACK_REDIRECT_URL: /
      CLERK_SIGN_UP_FALLBACK_REDIRECT_URL: /
      PLAYWRIGHT_PORT: 3100
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment
        run: npm run env:check:ci

      - name: Apply Prisma migrations
        run: npx prisma migrate deploy

      - name: Seed demo users
        run: npm run db:seed

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Run Playwright E2E suite
        run: npm run test:e2e
